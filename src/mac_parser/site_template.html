<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mac Hunter</title>
<!-- Іконка вкладки — той самий логотип, вбудований SVG (без окремого файлу) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%237C5CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Crect x='9' y='10' width='22' height='15' rx='2.5' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Cpath d='M5.5 29.5h29' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='17.5' r='3.6' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E">
<meta name="theme-color" content="#3B82F6">
<script>
  // Тема до першої відмальовки, щоб не блимало: "light" | "dark" | нічого (= як у системі).
  try { var t = localStorage.getItem("mh:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифт не блокує першу відмальовку: поки він вантажиться (або якщо Google недоступний) — системний шрифт. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:light dark;
  --bg:#F1F2EE;--card:#FFFFFF;--ink:#15181B;--ink2:#2B3035;--muted:#5B6168;--line:#E3E5E0;--chip:#EEF0EB;--edge:#CFD3CB;
  --inv:#15181B;--inv-ink:#FFFFFF;--ph:#DDE0D9;
  --good:#1B7A4B;--good-ink:#FFFFFF;--good-bg:#DFF1E6;--good-tx:#14593A;
  --mid:#F0C23A;--mid-ink:#241A00;--mid-bg:#FBF0CF;--mid-tx:#5C4100;
  --bad:#B8332A;--bad-ink:#FFFFFF;--bad-bg:#FBE5E2;--bad-tx:#7A1C15;
  --focus:#1F4FD8;
}
/* Темна тема в тонах GitHub Dark Dimmed: світліший синюватий фон замість майже чорного.
   Вмикається системою (prefers-color-scheme) або вручну перемикачем (data-theme на <html>). */
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#22272E;--card:#2D333B;--ink:#CDD9E5;--ink2:#ADBAC7;--muted:#909DAB;--line:#373E47;--chip:#373E47;--edge:#545D68;
  --inv:#316DCA;--inv-ink:#FFFFFF;--ph:#373E47;
  --good:#57AB5A;--good-ink:#1C2128;--good-bg:#2F4433;--good-tx:#6BC46D;
  --mid:#C69026;--mid-ink:#1C2128;--mid-bg:#3D3626;--mid-tx:#DAAA3F;
  --bad:#E5534B;--bad-ink:#1C2128;--bad-bg:#442D30;--bad-tx:#FF938A;
  --focus:#539BF5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --bg:#22272E;--card:#2D333B;--ink:#CDD9E5;--ink2:#ADBAC7;--muted:#909DAB;--line:#373E47;--chip:#373E47;--edge:#545D68;
  --inv:#316DCA;--inv-ink:#FFFFFF;--ph:#373E47;
  --good:#57AB5A;--good-ink:#1C2128;--good-bg:#2F4433;--good-tx:#6BC46D;
  --mid:#C69026;--mid-ink:#1C2128;--mid-bg:#3D3626;--mid-tx:#DAAA3F;
  --bad:#E5534B;--bad-ink:#1C2128;--bad-bg:#442D30;--bad-tx:#FF938A;
  --focus:#539BF5;
}}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{flex:none}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}

/* шапка */
header{position:relative;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 52px 0}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 4px 10px rgb(49 109 202 / .35))}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#3B82F6,#7C5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.theme{position:absolute;right:0;top:4px;width:44px;height:44px;border:1px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.sub{font-size:12px;font-weight:600;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--edge);overflow:hidden;margin:14px auto 6px;max-width:520px}
.prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3B82F6,#7C5CFF)}
.status{display:flex;flex-direction:column;align-items:center;gap:2px}
.status #upd{font-size:13px;font-weight:700;color:var(--ink2)}
.note{text-align:left}
[hidden]{display:none !important}  /* інакше display:flex у .note показує порожню смужку */
.note{display:flex;gap:10px;align-items:flex-start;background:var(--mid-bg);color:var(--mid-tx);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:10px}

/* панель керування */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--line);border-radius:14px;padding:4px}
.tabs button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:800}
.tabs small{font-size:12px;font-weight:700;color:var(--muted)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sort{display:flex;gap:2px}
.sort button{min-height:44px;border:0;background:none;padding:0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.sort button:first-child{padding-left:0}
.sort button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.ghost{min-height:36px;border:1px solid var(--edge);border-radius:10px;background:transparent;font-size:13px;font-weight:700;padding:0 10px;display:flex;align-items:center;gap:6px}
.ghost[aria-pressed=true]{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.f{min-height:36px;border:1px solid var(--edge);border-radius:999px;background:transparent;padding:0 12px;font-size:13px;font-weight:600}
.f[aria-pressed=true]{background:var(--inv);color:var(--inv-ink);border-color:var(--inv);font-weight:700}
.price{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.price input{width:92px;min-height:36px;border:1px solid var(--edge);border-radius:999px;background:transparent;padding:0 12px;color:var(--ink)}

/* список */
.list{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border-radius:18px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 760px;scroll-margin-top:120px}
.card.hit{outline:3px solid var(--focus);outline-offset:2px}
.gal{position:relative;aspect-ratio:10/7;background:var(--ph)}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always}
.pill{position:absolute;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.age{left:12px;top:12px;background:var(--card);color:var(--ink)}
.srcp{right:12px;top:12px;background:#15181B;color:#fff}
.nophoto .srcp{position:absolute}
.sold{color:var(--good-tx);font-weight:700}
.repost{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--mid-tx);background:var(--mid-bg);border-radius:8px;padding:4px 8px;align-self:flex-start}
.acts{display:flex;gap:8px}
.act{flex:1;min-height:44px;border:1px solid var(--edge);border-radius:12px;background:transparent;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.act[aria-pressed=true]{background:var(--chip);border-color:var(--ink2)}
.act:first-child[aria-pressed=true]{color:var(--focus);border-color:var(--focus)}
.favmark{color:var(--focus);display:inline-flex}
.hidebar{text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.hidebar button{border:0;background:none;color:var(--focus);font-weight:700;min-height:44px;padding:0 6px}
@media (max-width:420px){.tabs .favlbl{display:none}}
.cnt{right:12px;bottom:12px;background:#15181B;color:#fff}
.nav{position:absolute;top:calc(50% - 22px);width:44px;height:44px;border:0;border-radius:22px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.nav.p{left:8px}.nav.n{right:8px}
.nav:disabled{opacity:0;pointer-events:none}
.nophoto{height:120px;background:var(--ph);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;position:relative}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero>div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.pr{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.dl{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tag{border-radius:8px;padding:3px 8px;font-size:13px;font-weight:800}
.tag.good{background:var(--good-bg);color:var(--good-tx)}
.tag.bad{background:var(--bad-bg);color:var(--bad-tx)}
.tag.flat{background:var(--chip);color:var(--ink2)}
.score{flex:none;width:60px;height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.score b{font-size:26px;font-weight:800;line-height:1}
.score span{font-size:10px;font-weight:700;letter-spacing:.04em}
.score.good{background:var(--good);color:var(--good-ink)}
.score.mid{background:var(--mid);color:var(--mid-ink)}
.score.bad{background:var(--bad);color:var(--bad-ink)}
.score.none{border:2px dashed var(--edge);color:var(--muted);font-size:10px;font-weight:700;line-height:1.2;text-align:center;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--chip);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700}
.chips .cpu{background:var(--inv);color:var(--inv-ink);font-weight:800}
.batt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cell{flex:none;width:44px;height:20px;border:2px solid var(--ink);border-radius:6px;padding:2px}
.cell i{display:block;height:100%;border-radius:2px;background:var(--good)}
.cell.mid i{background:var(--mid)}.cell.bad i{background:var(--bad)}
.batt b{font-size:15px;font-weight:800}
.src{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.src.ok{color:var(--good-tx)}
.clean{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--good-tx)}
.risk{background:var(--bad-bg);color:var(--bad-tx);border-radius:12px;padding:12px}
.risk h3{margin:0 0 8px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.risk ul{font-size:13px;font-weight:600}
.sum{margin:0;color:var(--ink2);text-wrap:pretty}
details{border-top:1px solid var(--line)}
summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary svg{transform:rotate(180deg)}
.more{display:flex;flex-direction:column;gap:12px;padding-bottom:4px;font-size:13px}
.more h4{margin:0 0 4px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.meta{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.meta .t{color:var(--ink);font-size:13px;font-weight:700;overflow-wrap:anywhere}
.meta .who{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cta{min-height:48px;border-radius:12px;background:var(--inv);color:var(--inv-ink);font-weight:800;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}

/* компактний режим */
.rowbtn{display:none;width:100%;border:0;background:none;text-align:left;padding:10px;align-items:center;gap:12px}
.rowbtn .th{flex:none;width:72px;height:72px;border-radius:10px;background:var(--ph);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rowbtn .in{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rowbtn .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rowbtn .l1 b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.rowbtn .l1 .good{color:var(--good-tx);font-weight:800;font-size:13px}
.rowbtn .l1 .bad{color:var(--bad-tx);font-weight:800;font-size:13px}
.rowbtn .l1 .flat{color:var(--muted);font-weight:700;font-size:13px}
.rowbtn .l2{font-size:13px;font-weight:700;color:var(--ink2)}
.rowbtn .l3{font-size:12px;font-weight:600;color:var(--muted)}
.rowbtn .score{width:44px;height:44px;border-radius:12px}
.rowbtn .score b{font-size:20px}
.rowbtn .score span{display:none}
.rowbtn .score.none{font-size:18px;font-weight:800}
.compact .list{gap:8px}
.compact .card{border-radius:14px;contain-intrinsic-size:auto 92px}
.compact .rowbtn{display:flex}
.compact .card:not(.open) .full{display:none}
.compact .card.open .rowbtn{border-bottom:1px solid var(--line)}

/* пояснення «Найкраще» */
.explain{background:var(--card);border:0;border-radius:14px;padding:0 14px}
.explain summary span{display:flex;align-items:center;gap:6px}
.explain-body{padding:0 0 12px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.explain-body p{margin:0;text-wrap:pretty}

/* сторінки */
.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.pager:empty{display:none}
.pager button{min-width:44px;min-height:44px;border:1px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 10px}
.pager button[aria-current=page]{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .gap{min-width:20px;text-align:center;color:var(--muted);font-weight:700}
.pager .range{flex-basis:100%;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}

.empty{background:var(--card);border-radius:18px;padding:32px 20px;text-align:center;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:12px;grid-column:1/-1}
.empty b{color:var(--ink);font-size:16px;font-weight:800}
@media (prefers-reduced-motion:no-preference){
  .track{scroll-behavior:smooth}
  details summary svg{transition:transform .15s}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <button class="theme" id="theme" type="button"></button>
    <div class="brand">
      <!-- Логотип: ноутбук із прицілом на екрані -->
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs>
        <rect width="40" height="40" rx="11" fill="url(#lg)"/>
        <rect x="9" y="10" width="22" height="15" rx="2.5" fill="none" stroke="#fff" stroke-width="2.2"/>
        <path d="M5.5 29.5h29" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="20" cy="17.5" r="3.6" fill="none" stroke="#fff" stroke-width="1.8"/>
        <path d="M20 11.8v2.2M20 21v2.2M14.3 17.5h2.2M23.5 17.5h2.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div><h1>Mac <em>Hunter</em></h1></div>
    </div>
    <div class="tagline">MacBook Air M1 / M2 на OLX · оцінка угод від AI</div>
    <div class="prog" id="prog" role="progressbar" aria-label="Перевірено AI" aria-valuemin="0"><i></i></div>
    <div class="status"><span id="upd">завантаження…</span><span class="sub" id="ana"></span></div>
    <div class="note" id="note" role="status" hidden></div>
  </header>
  <div class="bar">
    <nav class="tabs" id="tabs" aria-label="Розділи"></nav>
  </div>
  <div class="row2">
    <div class="sort" id="sort" role="group" aria-label="Сортування"></div>
    <button class="ghost" id="view" type="button" aria-pressed="false"></button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Фільтри"></div>
  <div id="explain"></div>
  <main class="list" id="list" aria-live="polite"></main>
  <nav class="pager" id="pager" aria-label="Сторінки"></nav>
  <div class="hidebar" id="hidebar"></div>
</div>

      return el("button", Object.assign({ type: "button", onclick: function () { setPage(page); } }, attrs || {}), label);
    };
    const nodes = [btn(icon("left", 18, 2.5), state.page - 1, { "aria-label": "Попередня сторінка", disabled: state.page === 1 })];
    pageNumbers(state.page, pages).forEach(function (p) {
      nodes.push(p === "…" ? el("span", { class: "gap", text: "…" })
        : btn(String(p), p, { "aria-label": "Сторінка " + p, "aria-current": p === state.page ? "page" : null }));
    });
    nodes.push(btn(icon("right", 18, 2.5), state.page + 1, { "aria-label": "Наступна сторінка", disabled: state.page === pages }),
      el("span", { class: "range", text: ((state.page - 1) * PER + 1) + "–" + Math.min(total, state.page * PER) + " із " + total }));
    pager.replaceChildren.apply(pager, nodes);  // масив треба розгорнути, інакше він стане текстом
  }
  function renderExplain() {
    const box = $("explain");
    if (state.tab !== "best" || !data) { box.replaceChildren(); return; }
    box.replaceChildren(el("details", { class: "explain" },
      el("summary", null, el("span", null, icon("star", 15), " Як складається «Найкраще»?"), icon("down", 18)),
      el("div", { class: "explain-body" },
        el("p", { text: "Сюди потрапляють оголошення, яким AI поставив оцінку угоди " + data.best_min_score + " або вище з 10." }),
        el("p", { text: "Оцінку AI ставить, дивлячись на все разом: ціну відносно медіани схожих оголошень (той самий чіп, " +
          "пам'ять, накопичувач і діагональ), стан на фото, батарею й цикли (особливо якщо видно на скріні), " +
          "комплект і ризики — iCloud-блок, ремонти, підозрілу ціну. 8+ — варто дзвонити сьогодні, 5–7 — нормально, ≤ 4 — пропустити." }),
        el("p", { text: "Порядок: спершу вища оцінка, за однакової — більша знижка від ринкової медіани, далі — дешевше." }))));
  }
  function renderList() {
    const items = visibleItems();
    const list = $("list");
    renderExplain();
    const pages = Math.max(1, Math.ceil(items.length / PER));
    if (state.page > pages) state.page = pages;
    if (!items.length) {
      renderPager(0);
      const filtered = hasFilters();
      list.replaceChildren(el("div", { class: "empty" },
        el("b", { text: filtered ? "Нічого не знайдено за цими фільтрами" : state.tab === "best" ? "Поки що немає найкращих"
          : state.tab === "fav" ? "В обраному поки порожньо" : "Оголошень немає" }),
        el("span", { text: filtered ? "Спробуйте послабити умови."
          : state.tab === "best" ? "Жодне оголошення ще не отримало оцінку AI " + data.best_min_score + " або вище. Загляньте в M1 чи M2."
          : state.tab === "fav" ? "Натисніть «В обране» на картці — вона з'явиться тут (зберігається на цьому пристрої)."
          : "У цьому розділі зараз порожньо." }),
        filtered && el("button", { class: "ghost", type: "button", text: "Скинути фільтри", onclick: resetFilters })));
      return;
    }
    const frag = document.createDocumentFragment();
    items.slice((state.page - 1) * PER, state.page * PER).forEach(function (l) { frag.append(card(l)); });
    list.replaceChildren(frag);
    renderPager(items.length);
    renderHidebar();
  }
  function renderHidebar() {
    const bar = $("hidebar");
    const n = data.listings.filter(function (l) { return hidden.has(l.key); }).length;
    if (!n || state.tab === "fav") { bar.replaceChildren(); return; }
    bar.replaceChildren(state.showHidden
      ? el("span", null, "Показую приховані (" + n + ") · ", el("button", { type: "button", text: "повернутись до всіх",
          onclick: function () { state.showHidden = false; resetPage(); render(); } }))
      : el("span", null, "Приховано " + n + " · ", el("button", { type: "button", text: "показати",
          onclick: function () { state.showHidden = true; resetPage(); render(); } })));
  }
  function render() { renderControls(); renderFilters(); renderList(); }
  // Будь-яка зміна вибірки (розділ, сортування, фільтр, ціна) повертає на першу сторінку.
  function resetPage() { state.page = 1; syncUrl(); }
  function resetFilters() { state.on = {}; state.min = state.max = null; resetPage(); render(); }
  function setTab(t) {
    state.tab = t;
    resetPage();
    render();
  }
  function focusHash() {
    let id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (!id || !data) return;
    const l = data.listings.find(function (x) { return x.key === id; });
    if (!l) return;
    if (!document.getElementById(id)) {
      state.on = {}; state.min = state.max = null;
      if (!inTab(l, state.tab)) state.tab = l.chip;
      // картка може бути на іншій сторінці — відкриваємо саме ту
      const idx = visibleItems().findIndex(function (x) { return x.key === id; });
      state.page = idx >= 0 ? Math.floor(idx / PER) + 1 : 1;
      syncUrl();  // разом з адресою, щоб оновлення сторінки лишило той самий розділ
      render();
    }
    const n = document.getElementById(id);
    if (!n) return;
    document.querySelectorAll(".card.hit").forEach(function (x) { x.classList.remove("hit"); });
    n.classList.add("hit", "open");
    const rb = n.querySelector(".rowbtn");
    if (rb) rb.setAttribute("aria-expanded", "true");
    const jump = function () { n.scrollIntoView({ block: "start" }); };
    jump();
    requestAnimationFrame(function () { requestAnimationFrame(jump); });
  }
  function renderHeader() {
    $("upd").textContent = ago(data.updated);
    const a = num(data.analyzed) || 0, t = num(data.total) || data.listings.length;
    $("ana").textContent = "AI перевірив " + a + " із " + t + " " + plural(t, ["оголошення", "оголошень", "оголошень"]) +
      (num(data.scan_interval_min) != null ? " · оновлення кожні " + data.scan_interval_min + " хв" : "");
    const p = $("prog");
    p.setAttribute("aria-valuemax", t);
    p.setAttribute("aria-valuenow", a);
    p.firstElementChild.style.width = (t ? Math.min(100, a / t * 100) : 0) + "%";
    const note = $("note");
    note.hidden = !data.ai_note;
    if (data.ai_note) note.replaceChildren(icon("alert", 18), el("span", { text: data.ai_note }));
  }

  // ---------- тема ----------
  const THEMES = [["auto", "як у системі", "auto"], ["light", "світла", "sun"], ["dark", "темна", "moon"]];
  function renderTheme() {
    const cur = store.get("theme") || "auto";
    const t = THEMES.find(function (x) { return x[0] === cur; }) || THEMES[0];
    const b = $("theme");
    b.replaceChildren(icon(t[2], 20, 2));
    b.setAttribute("aria-label", "Тема: " + t[1] + ". Натисніть, щоб змінити");
    b.title = "Тема: " + t[1];
  }
  $("theme").addEventListener("click", function () {
    const cur = store.get("theme") || "auto";
    const next = THEMES[(THEMES.findIndex(function (x) { return x[0] === cur; }) + 1) % THEMES.length][0];
    store.set("theme", next);
    if (next === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = next;
    renderTheme();
  });
  renderTheme();

  $("view").addEventListener("click", function () {
    state.compact = !state.compact;
    store.set("compact", state.compact ? "1" : "0");
    renderControls();
  });
  window.addEventListener("hashchange", focusHash);

  async function load() {
    try {
      const r = await fetch("data.json", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      d.listings = arr(d.listings).filter(function (l) { return l && l.key && num(l.price) != null; });
      if (num(d.best_min_score) == null) d.best_min_score = 7;
      data = d;
      renderHeader();
      render();
      focusHash();
    } catch (e) {
      $("upd").textContent = "помилка";
      $("list").replaceChildren(el("div", { class: "empty" },
        el("b", { text: "Не вдалося завантажити дані" }),
        el("span", { text: "Файл data.json недоступний (" + e.message + ")." }),
        el("button", { class: "ghost", type: "button", text: "Спробувати ще раз", onclick: load })));
    }
  }
  load();
})();
</script>
</body>
</html>
