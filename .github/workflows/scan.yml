# Кожні 30 хв: скан OLX → аналіз Gemini → пуші в Telegram → сайт на GitHub Pages.
# База (SQLite) живе між запусками в гілці `data` (один коміт, перезаписується щоразу).
name: scan

on:
  schedule:
    - cron: "7,37 * * * *"   # не рівно :00/:30 — у цей час GitHub перевантажений і затримує запуски
  workflow_dispatch:

permissions:
  contents: write   # запис бази в гілку data
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Відновити базу з гілки data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:macbot.sqlite3 > data/macbot.sqlite3
            echo "База відновлена: $(du -h data/macbot.sqlite3 | cut -f1)"
          else
            echo "Гілки data ще нема — стартую з порожньої бази"
          fi

      - name: Скан, AI, пуші, сайт
        run: uv run --frozen mac-parser cycle --out site

      - name: Зберегти базу в гілку data
        if: always() && hashFiles('data/macbot.sqlite3') != ''
        run: |
          mkdir state && cp data/macbot.sqlite3 state/
          cd state
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macbot.sqlite3
          git commit -qm "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      # GitHub вимикає розклад, якщо в репозиторії 60 днів не було комітів. Раз на 45 днів —
      # порожній коміт у main, щоб бот не замовк сам собою.
      - name: Не дати GitHub вимкнути розклад
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct origin/${{ github.event.repository.default_branch }} 2>/dev/null || git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Останній коміт у main: $age_days дн. тому"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -qm "chore: keepalive (розклад GitHub Actions)"
            git push -q origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
